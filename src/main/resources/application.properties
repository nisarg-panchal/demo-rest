spring.application.name=demo-rest
server.port=8080
server.compression.enabled=true
server.http2.enabled=true

logging.level.root=INFO

#Spring Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:6432/peopledb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.redisson.config=redisson.yaml
spring.jpa.properties.hibernate.generate_statistics=true

# Optional TTL (default is infinite)
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

#Redis Configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.output.ansi.enabled=ALWAYS

spring.docker.compose.file=docker/compose.yaml

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=*
management.endpoints.web.cors.allowed-origin-patterns=*
management.endpoint.health.show-details=always

# default endpoints created by Spring AI
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
